<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search PubChem by name or SMILES and inspect the 3D structure and properties of a compound." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MolView 3D</title>

    <!--
      Resolve the theme before first paint so there is no flash of the wrong theme.
      Order: stored choice → prefers-color-scheme → dark (default).
      Must stay in sync with src/hooks/useTheme.ts (same storage key).
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("molview:theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="preconnect" href="https://pubchem.ncbi.nlm.nih.gov" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
